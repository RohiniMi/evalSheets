        <text x="125" y="188" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
          struct Node* reverseList(struct Node* head) {
        </text>
      

        <text x="125" y="214" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              struct Node *prev = NULL;
        </text>
      

        <text x="125" y="240" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              struct Node *curr = head;
        </text>
      

        <text x="125" y="266" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              struct Node *next = NULL;
        </text>
      

        <text x="125" y="292" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              while(curr != NULL) {
        </text>
      

        <text x="125" y="318" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  next = curr-&gt;next;
        </text>
      

        <text x="125" y="344" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  curr-&gt;next = prev;
        </text>
      

        <text x="125" y="370" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  prev = curr;
        </text>
      

        <text x="125" y="396" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  curr = next;
        </text>
      

        <text x="125" y="422" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              }
        </text>
      

        <text x="125" y="448" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              return prev;
        </text>
      

        <text x="125" y="474" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
          }
        </text>
      

