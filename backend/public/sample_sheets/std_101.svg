        <text x="125" y="578" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
          int binarySearch(int arr[], int n, int target) {
        </text>
      

        <text x="125" y="604" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              int low = 0, high = n - 1;
        </text>
      

        <text x="125" y="630" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              while (low &lt;= high) {
        </text>
      

        <text x="125" y="656" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  int mid = low + (high - low) / 2;
        </text>
      

        <text x="125" y="682" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  if (arr[mid] == target)
        </text>
      

        <text x="125" y="708" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                      return mid;
        </text>
      

        <text x="125" y="734" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  else if (arr[mid] &lt; target)
        </text>
      

        <text x="125" y="760" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                      low = mid + 1;
        </text>
      

        <text x="125" y="786" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                  else
        </text>
      

        <text x="125" y="812" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
                      high = mid - 1;
        </text>
      

        <text x="125" y="838" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              }
        </text>
      

        <text x="125" y="864" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
              return -1;
        </text>
      

        <text x="125" y="890" font-family="'Caveat', 'Segoe Print', cursive" font-size="17" fill="#1e3a8a" letter-spacing="0.3">
          }
        </text>
      

